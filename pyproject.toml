[project]
name = "alternance"
version = "0.1.0"
description = "Ingestion et consultation des offres d'emploi en alternance (API La Bonne Alternance) dans DuckDB et MongoDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "pydantic-settings>=2.6.0",
    "pymongo>=4.10.0",
    "requests>=2.32.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alternance"]
