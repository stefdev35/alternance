<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Alternance — Offres{% endblock %}</title>
  <style>
    :root {
      --primary: #0b6bcb;
      --bg: #f5f7fa;
      --card: #ffffff;
      --border: #e3e8ef;
      --text: #1c2733;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 20px; }
    header a { color: #fff; text-decoration: none; }
    .badge {
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
    }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .card h2 { margin: 0 0 6px; font-size: 17px; }
    .card h2 a { color: var(--primary); text-decoration: none; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: #eef4fb;
      color: var(--primary);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
    }
    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .status.Active { background: #dcfce7; color: #166534; }
    .status.Filled { background: #fef9c3; color: #854d0e; }
    .status.Cancelled { background: #fee2e2; color: #991b1b; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
    select, input[type=text] {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .muted { color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    dl { margin: 0; }
    dt { color: var(--muted); font-size: 12px; text-transform: uppercase; margin-top: 12px; }
    dd { margin: 2px 0 0; }
    ul { margin: 4px 0 0; padding-left: 20px; }
    .pill {
      display: inline-block; background: #e2e8f0; color: #334155;
      border-radius: 6px; padding: 2px 8px; font-size: 12px; margin: 2px;
    }
    .back { margin-bottom: 16px; display: inline-block; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<header>
  <h1><a href="/">Alternance — Offres</a></h1>
  <span class="badge">Backend : {{ backend }}</span>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
